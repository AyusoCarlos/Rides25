<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Crear Viaje</title>
</h:head>

<h:body>
    <h:form>
        <h2>Crear nuevo viaje</h2>

        <h:panelGrid columns="2" cellpadding="5">
            <h:outputLabel for="origen" value="Origen:" />
            <h:inputText id="origen" value="#{createRideBean.origen}" required="true" />

            <h:outputLabel for="destino" value="Destino:" />
            <h:inputText id="destino" value="#{createRideBean.destino}" required="true" />

            <h:outputLabel for="fecha" value="Fecha (dd/MM/yyyy):" />
            <h:inputText id="fecha" value="#{createRideBean.fecha}" required="true">
                <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:inputText>

            <h:outputLabel for="numPlazas" value="Número de plazas:" />
            <h:inputText id="numPlazas" value="#{createRideBean.numPlazas}" required="true" />

            <h:outputLabel for="precio" value="Precio (€):" />
            <h:inputText id="precio" value="#{createRideBean.precio}" required="true" />
        </h:panelGrid>

        <h:messages globalOnly="true" style="color:red" />

        <p>
            <h:commandButton value="Crear viaje" action="#{createRideBean.crear}" />
        </p>
    </h:form>

    <h:form>
        <h:commandButton value="Volver al menú" action="home.xhtml" />
    </h:form>
</h:body>

</html>
