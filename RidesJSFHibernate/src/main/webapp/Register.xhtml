<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Registro - Rides</title>
</h:head>

<h:body>
    <h:form>
        <h2>Registro de usuario</h2>

        <h:panelGrid columns="2" cellpadding="5">
            <h:outputLabel for="nombre" value="Nombre completo:" />
            <h:inputText id="nombre" value="#{registerBean.nombre}" required="true" />

            <h:outputLabel for="email" value="Correo electrónico:" />
            <h:inputText id="email" value="#{registerBean.email}" required="true" />

            <h:outputLabel for="password" value="Contraseña:" />
            <h:inputSecret id="password" value="#{registerBean.password}" required="true" />
        </h:panelGrid>

        <h:messages globalOnly="true" style="color:red" />

        <p>
            <h:commandButton value="Registrarse" action="#{registerBean.registrar}" />
        </p>
    </h:form>

    <h:form>
        <h:commandButton value="Volver al login" action="Login.xhtml" />
    </h:form>
</h:body>

</html>
