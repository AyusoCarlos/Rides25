<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Login - Rides</title>
</h:head>

<h:body>
    <h:form>
        <h2>Iniciar sesión</h2>

        <h:panelGrid columns="2" cellpadding="5">
            <h:outputLabel for="email" value="Correo electrónico:"/>
            <h:inputText id="email" value="#{loginBean.email}" required="true"/>

            <h:outputLabel for="password" value="Contraseña:"/>
            <h:inputSecret id="password" value="#{loginBean.password}" required="true"/>
        </h:panelGrid>

        <h:messages globalOnly="true" style="color:red" />

        <p>
            <h:commandButton value="Entrar" action="#{loginBean.login}" />
        </p>
    </h:form>

    <h:form>
        <h:commandButton value="¿No tienes cuenta? Regístrate" action="Register.xhtml"/>
    </h:form>
</h:body>

</html>
